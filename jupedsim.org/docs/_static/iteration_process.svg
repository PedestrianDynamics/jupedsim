<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 880" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="820" height="880" fill="#ffffff" rx="8"/>

  <!-- Pre-iteration / Python wrapper -->
  <rect x="60" y="24" width="460" height="68" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.8"/>
  <text x="290" y="49" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Between Iterations &amp; Frame-0 Check (Python Wrapper)</text>
  <text x="290" y="69" text-anchor="middle" font-size="12" fill="#334155">add_agent() (validates + runs Strategical &amp; Tactical) • mark_agent_for_removal()</text>
  <text x="290" y="84" text-anchor="middle" font-size="11" fill="#475569">If writer attached &amp; iteration == 0: begin_writing() + write_iteration_state()</text>

  <line x1="290" y1="92" x2="290" y2="124" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Native Simulation::iterate() container -->
  <rect x="36" y="126" width="508" height="642" rx="10" fill="#f1f5f9" stroke="#0284c7" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="54" y="149" font-size="13" font-weight="700" fill="#0369a1">C++ Simulation::iterate() — Single Step (dt)</text>

  <!-- Step 1: Agent Removal -->
  <rect x="60" y="164" width="460" height="72" rx="8" fill="#fef2f2" stroke="#e11d48" stroke-width="1.6"/>
  <text x="290" y="188" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">1. Agent Removal System</text>
  <text x="290" y="208" text-anchor="middle" font-size="12" fill="#7f1d1d">Erase agents queued by Exit stages (prev step) or mark_agent_for_removal()</text>
  <text x="290" y="224" text-anchor="middle" font-size="11" fill="#991b1b">Decrement StageManager targeting counters; clear removal queue</text>

  <line x1="290" y1="236" x2="290" y2="264" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Step 2: Neighborhood Search -->
  <rect x="60" y="266" width="460" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="290" y="291" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">2. Neighborhood Search Update</text>
  <text x="290" y="311" text-anchor="middle" font-size="12" fill="#1e3a8a">Rebuild spatial grid over remaining active agents</text>

  <line x1="290" y1="326" x2="290" y2="354" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Step 3: Strategical Decision System -->
  <rect x="60" y="356" width="460" height="84" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.6"/>
  <text x="290" y="380" text-anchor="middle" font-size="14" font-weight="700" fill="#854d0e">3. Strategical Decision System (Journeys &amp; Stages)</text>
  <text x="290" y="400" text-anchor="middle" font-size="12" fill="#713f12">Evaluate stage completion (Waypoint / Exit / DirectSteering)</text>
  <text x="290" y="417" text-anchor="middle" font-size="12" fill="#713f12">Advance transitions (Fixed, RoundRobin, LeastTargeted) &amp; migrate StageManager</text>
  <text x="290" y="432" text-anchor="middle" font-size="11" fill="#854d0e">Agents reaching an Exit are queued for Step 1 of the NEXT iteration</text>

  <!-- Deferred exit removal side-loop -->
  <path d="M 520 412 L 775 412 L 775 200 L 522 200" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>
  <rect x="572" y="274" width="188" height="64" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="666" y="296" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">Deferred Exit Removal</text>
  <text x="666" y="313" text-anchor="middle" font-size="10.5" fill="#475569">Exiting agents stay visible on</text>
  <text x="666" y="328" text-anchor="middle" font-size="10.5" fill="#475569">arrival frame; removed next step</text>

  <line x1="290" y1="440" x2="290" y2="468" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Step 4: Tactical Decision System -->
  <rect x="60" y="470" width="460" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="290" y="495" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">4. Tactical Decision System (Routing Engine)</text>
  <text x="290" y="515" text-anchor="middle" font-size="12" fill="#14532d">Compute unit route_orientation from agent.location toward agent.final_target</text>

  <line x1="290" y1="534" x2="290" y2="562" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Step 5: Operational Decision System -->
  <rect x="60" y="564" width="460" height="96" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="1.6"/>
  <text x="290" y="588" text-anchor="middle" font-size="14" font-weight="700" fill="#6b21a8">5. Operational Decision System (Double-Buffered)</text>
  <text x="290" y="608" text-anchor="middle" font-size="12" fill="#581c87">Compute movement = model.compute_next_state(current, next, step) for all agents</text>
  <text x="290" y="625" text-anchor="middle" font-size="12" fill="#581c87">Project onto walkable surface (move_on_surface) &amp; swap(agents, _next)</text>
  <text x="290" y="643" text-anchor="middle" font-size="11" fill="#6b21a8">Rebuild NeighborhoodSearch grid so post-step queries see new positions</text>

  <line x1="290" y1="660" x2="290" y2="688" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Step 6: Clock Advance -->
  <rect x="60" y="690" width="460" height="58" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.6"/>
  <text x="290" y="715" text-anchor="middle" font-size="14" font-weight="700" fill="#155e75">6. Simulation Clock Advance</text>
  <text x="290" y="734" text-anchor="middle" font-size="12" fill="#164e63">Increment iteration_count() and advance elapsed_time() by dt</text>

  <line x1="290" y1="768" x2="290" y2="796" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Post-step Trajectory Writer -->
  <rect x="60" y="798" width="460" height="58" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.8"/>
  <text x="290" y="823" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Post-Step Serialization &amp; Loop Control (Python Wrapper)</text>
  <text x="290" y="842" text-anchor="middle" font-size="12" fill="#334155">If writer attached: write_iteration_state() • Repeat for count steps</text>
</svg>
