name: Build Documentation

on:
  schedule:
    # Runs at 02:00 a.m. each Sunday
    - cron: '00 2 * * 0'
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master
      - rls-*
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Build documentation
        id: build-docs
        uses: ./.github/actions/build-docs
        with:
          python-version: "3.13"
          # The artifact holds the whole site with the docs under
          # docs/<version>/: the release tag for releases, dev otherwise.
          version: ${{ github.event_name == 'release' && github.event.release.tag_name || 'dev' }}
          out-path: ${{ runner.temp }}/site
          # Keep release builds around long enough to re-run a failed deployment.
          retention-days: ${{ github.event_name == 'release' && '30' || '1' }}
