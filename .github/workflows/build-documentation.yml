name: Build Documentation

on:
  schedule:
    # Runs at 02:00 a.m. each Sunday
    - cron: '00 2 * * 0'
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master
      - rls-*

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Build documentation
        id: build-docs
        uses: ./.github/actions/build-docs
        with:
          python-version: "3.14"
          # The artifact holds the whole site with the docs under docs/dev/;
          # releases are built and published by docs.yml.
          version: dev
          out-path: ${{ runner.temp }}/site
          retention-days: 1
