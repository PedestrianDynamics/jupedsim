name: Build Documentation

on:
  schedule:
    # Runs at 02:00 a.m. each Sunday
    - cron: '00 2 * * 0'
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master
      - rls-*

permissions:
  contents: read

env:
  # Python of every job in this workflow.
  PYTHON_VERSION: "3.14"

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Build the website
        uses: ./.github/actions/build-website
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # The artifact holds the whole website with the docs under
          # docs/stable/, where the PR preview serves them (and Pagefind
          # indexes them); releases are built and published by docs.yml.
          version: stable
          target: all
          retention-days: 1
