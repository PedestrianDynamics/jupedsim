name: Deploy PR Previews

on:
  workflow_run:
    workflows: ["Build Documentation"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

env:
  # Python of every job in this workflow.
  PYTHON_VERSION: "3.14"
  PREVIEWS_REPOSITORY: PedestrianDynamics/jupedsim-pr-previews
  PREVIEWS_BASE_URL: https://jupedsim-pr-previews.pedestriandynamics.org

jobs:
  deploy-preview:
    name: Deploy PR preview
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR number
        id: pr
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // List open PRs whose head is <fork-owner>:<branch>. The payload's
            // own pull_requests list cannot be used: it is empty for fork PRs.
            const run = context.payload.workflow_run;
            const head = `${run.head_repository.owner.login}:${run.head_branch}`;

            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head,
            });

            const pr = prs[0];
            if (!pr) {
              core.setFailed(`No open PR found for head ${head}`);
              return;
            }
            core.info(`Head ${head} belongs to PR #${pr.number}`);
            core.setOutput('number', pr.number);

            // The PR moved on since this build started. A newer build is
            // already running for the new head, so publishing these docs
            // would be stale (and could overwrite newer ones). Skip.
            if (pr.head.sha !== run.head_sha) {
              const msg = `Skipping preview for PR #${pr.number}: built ${run.head_sha}, PR head is now ${pr.head.sha}`;
              core.notice(msg);
              await core.summary.addRaw(`:fast_forward: ${msg}`).write();
              core.setOutput('deploy', 'false');
              return;
            }
            core.setOutput('deploy', 'true');

      # Only the website tooling of the default branch (this workflow_run
      # runs with the default branch's workflow file); no PR code is executed.
      # Installed before the previews checkout puts its write token on disk.
      - name: Checkout the website tooling
        if: steps.pr.outputs.deploy == 'true'
        uses: actions/checkout@v7
        with:
          path: jupedsim
          sparse-checkout: jupedsim.org/tools
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Set up Python
        if: steps.pr.outputs.deploy == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the website tooling
        if: steps.pr.outputs.deploy == 'true'
        run: python -m pip install ./jupedsim/jupedsim.org/tools

      - name: Checkout previews repository
        if: steps.pr.outputs.deploy == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.PREVIEWS_REPOSITORY }}
          token: ${{ secrets.JUPEDSIM_PR_PREVIEWS_TOKEN }}
          ref: main
          path: previews

      - name: Download the website artifact
        if: steps.pr.outputs.deploy == 'true'
        uses: actions/download-artifact@v8
        with:
          name: website
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/html

      # The artifact is the whole website (www pages at the root, docs under
      # docs/stable/). The pages link root-absolute (/docs/stable/, /articles/,
      # /pagefind/...), but the preview lives under /pull-requests/<N>/:
      # `preview publish` moves those links under that prefix, syncs the
      # build into pull-requests/<N>/ and pushes with retries (deploys for
      # different PRs run in parallel and share one branch).
      - name: Publish the preview
        if: steps.pr.outputs.deploy == 'true'
        id: publish
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          jps-website-tooling preview publish --build "$RUNNER_TEMP/html" \
            --number "$PR_NUMBER" --checkout previews

      # Links stay inside the preview (preview publish above), except
      # [DOCS V1] (/docs/v1x/...): previews have no 1.x archive, so it 404s.
      # Search covers the www pages and docs/stable/ (the PR build indexes
      # both; search.js derives the prefix from the pagefind.js URL).
      - name: Update PR body with preview links
        if: steps.pr.outputs.deploy == 'true'
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PREVIEW_URL: ${{ env.PREVIEWS_BASE_URL }}/pull-requests/${{ steps.pr.outputs.number }}/
          DOCS_URL: ${{ env.PREVIEWS_BASE_URL }}/pull-requests/${{ steps.pr.outputs.number }}/docs/stable/
          BUILT_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed(`Invalid PR number: ${process.env.PR_NUMBER}`);
              return;
            }
            const url = process.env.PREVIEW_URL;
            const docsUrl = process.env.DOCS_URL;
            const builtSha = process.env.BUILT_SHA.slice(0, 7);

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const start = '<!-- PREVIEW-URL-2-START -->';
            const end = '<!-- PREVIEW-URL-2-END -->';
            const snippet = [
              start,
              `New preview (built from ${builtSha}):`,
              `- Website: ${url}`,
              `- Documentation: ${docsUrl}`,
              end,
            ].join('\n');

            const original = pr.body || '';
            const updated = original.includes(start)
              ? original.replace(new RegExp(`${start}[\\s\\S]*?${end}`), snippet)
              : `${original}\n\n${snippet}`;

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              body: updated,
            });

            core.info(`Updated PR #${prNumber} with preview links: ${url}, ${docsUrl}`);
