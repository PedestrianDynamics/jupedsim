name: Publish Site

on:
  workflow_dispatch:

# Only the publish job pushes; the build runs third-party code with a
# read-only token.
permissions:
  contents: read

env:
  # Every publisher writes to this branch; release day flips it to gh-pages.
  PAGES_BRANCH: gh-pages-new

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      # The site is published from master of the upstream repository only.
      # GitHub's dispatch dialog cannot hide other branches, so the run
      # refuses them here, before anything is checked out.
      - name: Refuse anything but master of PedestrianDynamics/jupedsim
        env:
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$REF" != "refs/heads/master" ] || [ "$REPOSITORY" != "PedestrianDynamics/jupedsim" ]; then
            echo "::error::The site is published from refs/heads/master of PedestrianDynamics/jupedsim only; this run is on $REF of $REPOSITORY. The branch picker of the dispatch dialog cannot be restricted: pick master."
            exit 1
          fi
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # site/ has no notebooks that execute. One without stored outputs would
      # need an importable jupedsim (add `python3 -m pip install jupedsim`
      # here); until then the strict build fails loudly instead.
      - name: Install the site requirements and the website tooling
        run: |
          python3 -m pip install --quiet -r jupedsim.org/site/requirements.txt
          python3 -m pip install --quiet ./jupedsim.org/tools
      - name: Build the site
        env:
          OUT_PATH: ${{ runner.temp }}/site
        run: |
          # --only site: no docs, no Pagefind (the publish rebuilds the index
          # over the published tree). --strict: warnings fail the build.
          jps-site-tooling build-site --source jupedsim.org --out "$OUT_PATH" \
            --only site --strict
          test -f "$OUT_PATH/index.html" || { echo "::error::The site build produced no index.html"; exit 1; }
      - name: Store the site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: ${{ runner.temp }}/site/
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish the site
    needs: build
    # One site publish at a time (a pending one can still be replaced by a
    # newer pending one; re-run it). The docs publisher uses its own group;
    # the two race on the Pages branch through the tooling's push-retry loop.
    concurrency:
      group: pages-site
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (website tooling, tag target)
        uses: actions/checkout@v7
        with:
          path: jupedsim
      - name: Checkout the Pages branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PAGES_BRANCH }}
          path: pages
      - name: Download the site artifact
        uses: actions/download-artifact@v8
        with:
          name: site
          path: ${{ runner.temp }}/html
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install the website tooling
        run: python3 -m pip install --quiet ./jupedsim/jupedsim.org/tools
      # publish site: replaces everything at the root except docs/, CNAME,
      # .nojekyll and the index it rebuilds; pushes with retries. The same
      # site twice is not an error (changed=false), the tag is still created.
      - name: Publish the site
        id: publish
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          jps-site-tooling publish site --build "$RUNNER_TEMP/html" \
            --checkout pages --branch "$PAGES_BRANCH" --source-sha "$SOURCE_SHA"
      - name: Tag the source commit
        id: tag
        env:
          SOURCE_SHA: ${{ github.sha }}
          PAGES_SHA: ${{ steps.publish.outputs.pages_sha }}
        run: |
          jps-site-tooling tag --kind site --checkout jupedsim --branch "$PAGES_BRANCH" \
            --source-sha "$SOURCE_SHA" --pages-sha "$PAGES_SHA"
      # Also after a failed tag push: the Pages commit landed and is named.
      - name: Summary
        if: always() && steps.publish.outcome == 'success'
        env:
          SOURCE_SHA: ${{ github.sha }}
          PAGES_SHA: ${{ steps.publish.outputs.pages_sha }}
          CHANGED: ${{ steps.publish.outputs.changed }}
          SOURCE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          {
            echo "## Site published"
            echo "- source: $SOURCE_SHA"
            echo "- Pages commit ($PAGES_BRANCH): $PAGES_SHA (changed: $CHANGED)"
            echo "- source tag: $SOURCE_TAG"
          } >> "$GITHUB_STEP_SUMMARY"
