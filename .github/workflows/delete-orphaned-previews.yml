name: Delete Orphaned PR Previews

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read
  pull-requests: read

jobs:
  cleanup:
    name: Delete Orphaned PR Previews
    runs-on: ubuntu-latest

    steps:
      # The website tooling of the triggering branch (the default branch on
      # the nightly run); no PR code is executed. Installed before the
      # previews checkout puts its write token on disk.
      - name: Checkout the website tooling
        uses: actions/checkout@v7
        with:
          path: jupedsim
          sparse-checkout: jupedsim.org/tools
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install the website tooling
        run: python -m pip install --quiet ./jupedsim/jupedsim.org/tools

      - name: Checkout PR previews
        uses: actions/checkout@v7
        with:
          repository: PedestrianDynamics/jupedsim-pr-previews
          token: ${{ secrets.JUPEDSIM_PR_PREVIEWS_TOKEN }}
          ref: main
          path: pr-previews

      - name: Delete orphaned previews
        working-directory: pr-previews
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Preview deploys push to the same branch, so a push can be rejected
          # as non-fast-forward. Rebasing a stale deletion commit onto the new
          # tip could strip files of a preview that was re-deployed in the
          # meantime (PR reopened, build in flight) or stop on modify/delete
          # conflicts. On rejection, restart from the current remote tip and
          # recompute the deletions.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            jps-site-tooling preview prune pull-requests --repo "$GITHUB_REPOSITORY"

            git add -A
            if git diff --cached --quiet; then
              echo "No orphaned previews to delete."
              exit 0
            fi
            # Record which previews go, e.g. "#12, #34"; the run log expires.
            numbers=$(git diff --cached --name-only --diff-filter=D \
              | cut -d/ -f2 | sort -un | sed 's/^/#/' | paste -sd ',' - | sed 's/,/, /g')
            git commit -m "docs: delete orphaned PR previews ($numbers)"

            if git push origin HEAD:main; then
              echo "Deleted orphaned previews: $numbers" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Push rejected (attempt $attempt), retrying"
            sleep $((attempt * 5))
          done

          echo "::error::Failed to push cleanup after 5 attempts"
          exit 1
