name: Delete Orphaned PR Previews

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read
  pull-requests: read

env:
  # Python of every job in this workflow.
  PYTHON_VERSION: "3.14"

jobs:
  cleanup:
    name: Delete Orphaned PR Previews
    runs-on: ubuntu-latest

    steps:
      # The website tooling of the triggering branch (the default branch on
      # the nightly run); no PR code is executed. Installed before the
      # previews checkout puts its write token on disk.
      - name: Checkout the website tooling
        uses: actions/checkout@v7
        with:
          path: jupedsim
          sparse-checkout: jupedsim.org/tools
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the website tooling
        run: python -m pip install ./jupedsim/jupedsim.org/tools

      - name: Checkout PR previews
        uses: actions/checkout@v7
        with:
          repository: PedestrianDynamics/jupedsim-pr-previews
          token: ${{ secrets.JUPEDSIM_PR_PREVIEWS_TOKEN }}
          ref: main
          path: pr-previews

      # `preview prune` deletes the previews of closed PRs, commits and pushes
      # with retries; deletions are recomputed on every attempt (see the
      # docstring of jps_website_tooling.previews).
      - name: Delete orphaned previews
        id: prune
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jps-website-tooling preview prune --checkout pr-previews

      - name: Summary
        env:
          DELETED: ${{ steps.prune.outputs.deleted }}
        run: |
          if [ -n "$DELETED" ]; then
            echo "Deleted orphaned previews: #${DELETED//,/, #}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No orphaned previews to delete." >> "$GITHUB_STEP_SUMMARY"
          fi
