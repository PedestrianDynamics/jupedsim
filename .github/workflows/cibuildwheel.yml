name: Build CI wheels
on:
  schedule:
    # Runs at 02:00 a.m. each Sunday
    - cron: '00 2 * * 0'
  push:
    branches:
      - master
      - rls-*
  pull_request:
    branches:
      - master
      - rls-*
  release:
    types: [published]
    branches:
      - master
      - rls-*
permissions:
  contents: read
jobs:
  checks:
    name: Check Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install ruff
      - name: Install clang-format-21
        run: |
          sudo add-apt-repository 'deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main'
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo apt update
          sudo apt install clang-format-21
      - name: Run checks
        run: ./scripts/ci/check_format.sh
  tests:
    name: Run tests [${{ matrix.toolchain.cxx }}]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [{cc: clang, cxx: clang++}, {cc: gcc, cxx: g++}]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build & test with ${{ matrix.toolchain.cc }} / ${{ matrix.toolchain.cxx }}
        env:
          CC: ${{ matrix.toolchain.cc }}
          CXX: ${{ matrix.toolchain.cxx }}
        run: ./scripts/ci/gh_build_linux.sh
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        name: Install Python
        with:
          python-version: 3.13
      - name: Install dependencies
        run: python -m pip install wheel build setuptools
      - name: Build sdist
        run: |
          python -m build -s
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: python-packages-sdist
          path: dist/jupedsim-*.tar.gz
          if-no-files-found: error
  build_wheels:
    name: Build wheels on ${{ matrix.os }} for ${{ matrix.cibw_archs }}
    runs-on: ${{ matrix.os }}
    env:
      CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_34
      CIBW_SKIP: "*musllinux*"
      MACOSX_DEPLOYMENT_TARGET: 15.4
      # Install Rust inside the build container before building the wheel
      CIBW_BEFORE_ALL_LINUX: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable"
      CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            cibw_archs: "x86_64"
            cibw_build: "cp310-*"
          - os: ubuntu-latest
            cibw_archs: "x86_64"
            cibw_build: "cp311-*"
          - os: ubuntu-latest
            cibw_archs: "x86_64"
            cibw_build: "cp312-*"
          - os: ubuntu-latest
            cibw_archs: "x86_64"
            cibw_build: "cp313-*"
          - os: ubuntu-latest
            cibw_archs: "x86_64"
            cibw_build: "cp314-*"
          - os: windows-latest
            cibw_archs: "auto64"
            cibw_build: "cp310-*"
          - os: windows-latest
            cibw_archs: "auto64"
            cibw_build: "cp311-*"
          - os: windows-latest
            cibw_archs: "auto64"
            cibw_build: "cp312-*"
          - os: windows-latest
            cibw_archs: "auto64"
            cibw_build: "cp313-*"
          - os: windows-latest
            cibw_archs: "auto64"
            cibw_build: "cp314-*"
          - os: macos-15
            cibw_archs: "x86_64"
            cibw_build: "cp310-*"
          - os: macos-15
            cibw_archs: "x86_64"
            cibw_build: "cp311-*"
          - os: macos-15
            cibw_archs: "x86_64"
            cibw_build: "cp312-*"
          - os: macos-15
            cibw_archs: "x86_64"
            cibw_build: "cp313-*"
          - os: macos-15
            cibw_archs: "x86_64"
            cibw_build: "cp314-*"
          - os: macos-15
            cibw_archs: "arm64"
            cibw_build: "cp310-*"
          - os: macos-15
            cibw_archs: "arm64"
            cibw_build: "cp311-*"
          - os: macos-15
            cibw_archs: "arm64"
            cibw_build: "cp312-*"
          - os: macos-15
            cibw_archs: "arm64"
            cibw_build: "cp313-*"
          - os: macos-15
            cibw_archs: "arm64"
            cibw_build: "cp314-*"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install Rust toolchain Windows
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable
      - name: Install Rust toolchain MacOS
        if: runner.os == 'macOS'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Build wheels for CPython ${{ matrix.cibw_build }} on ${{ matrix.cibw_archs }}
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: ${{ matrix.cibw_build }}
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          # Early smoke test to ensure whl can be loaded
          CIBW_TEST_COMMAND: python -c "import jupedsim"
      - name: Extract Python Version (Unix/Mac)
        shell: bash
        run: echo "PYTHON_VERSION=$(echo ${{ matrix.cibw_build }} | cut -d'-' -f1)" >> $GITHUB_ENV
        if: runner.os != 'Windows'
      - name: Extract Python Version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pythonVersion = "${{ matrix.cibw_build }}" -split '-' | Select-Object -First 1
          $pythonVersion = $pythonVersion.Trim()
          echo "PYTHON_VERSION=$pythonVersion" | Out-File -Append -FilePath $env:GITHUB_ENV
      - uses: actions/upload-artifact@v7
        with:
          name: python-packages-${{ matrix.os }}-${{ matrix.cibw_archs }}-${{ env.PYTHON_VERSION }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error
  test-wheels:
    name: Test wheel on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    needs: [build_wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-26, macos-15-intel, macos-26-intel]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: python-packages-*
          merge-multiple: true
          path: dist
      - name: Install wheel
        run: |
          python -m pip install -U pip
          python -m pip install --find-links=dist jupedsim
      - name: Check installation
        run: |
          python -c "import jupedsim; print(jupedsim.__version__)"
  test-sdist:
    name: Test sdist install
    needs: [build_sdist]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: 3.13
      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: python-packages-*
          merge-multiple: true
          path: dist
      - name: Install wheel
        run: |
          python -m pip install -U pip
          python -m pip install dist/jupedsim*.tar.gz
      - name: Check installation
        run: |
          python -c "import jupedsim; print(jupedsim.__version__)"
  pypi-publish:
    needs: [test-wheels, test-sdist]
    if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      # retrieve your distributions here
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: python-packages-*
          merge-multiple: true
          path: dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
