# SPDX-License-Identifier: LGPL-3.0-or-later
[theme]
inherit = basic
stylesheet = basic.css, jupedsim-style.css, chroma-dark.css, book.css, site.css
sidebars =
pygments_style = friendly

[options]
site_name = JuPedSim
nav_home_url = /
# logo_light/logo_dark: SVG files under _static/; the <img> width/height
# come from each file's viewBox (aspect ratio reserved before load); empty
# logo_dark = one logo in every theme.
logo_light = jupedsim-mark-light.svg
logo_dark = jupedsim-mark-dark.svg
# nav_items: top-bar links, a list of {title, url, section, prefix?,
# external?}; the item whose section is the page's section is marked
# aria-current. nav_section: the whole project's section (docs sets
# "docs"; it also gets the version select and docs tree); empty = match
# the page name against each item's prefix.
nav_items =
nav_section =
kicker = JuPedSim
kicker_by_prefix =
stats_prefixes =
switcher_json_url =
switcher_version_match =
pagefind_url = /pagefind/pagefind.js
feed_url =
# footer_text: left part of the page footer (empty = "© <copyright>", else
# site_name). footer_links: its links on the right, same shape as nav_items
# (title + url are used).
footer_text =
footer_links =
toc_title = On this page
